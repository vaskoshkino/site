<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Панорама природы: лес и горы на рассвете">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa8dc"/>
      <stop offset=".45" stop-color="#9ed4ec"/>
      <stop offset=".75" stop-color="#e6f2f6"/>
      <stop offset="1" stop-color="#f9e3bd"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4d2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff4d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8cde1"/>
      <stop offset="1" stop-color="#7ba7c3"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c93a9"/>
      <stop offset="1" stop-color="#3a6d82"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6a5b"/>
      <stop offset="1" stop-color="#1c4b42"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173f38"/>
      <stop offset="1" stop-color="#0c2724"/>
    </linearGradient>

    <pattern id="pines" width="150" height="200" patternUnits="userSpaceOnUse">
      <g fill="#1d4b41">
        <path d="M55 10 L30 75 L80 75 Z"/>
        <path d="M55 45 L20 130 L90 130 Z"/>
        <path d="M55 90 L8 185 L102 185 Z"/>
      </g>
      <g fill="#256054">
        <path d="M120 40 L98 100 L142 100 Z"/>
        <path d="M120 72 L88 150 L152 150 Z"/>
        <path d="M120 112 L80 200 L160 200 Z"/>
      </g>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#sky)"/>
  <circle cx="1245" cy="135" r="230" fill="url(#sun)"/>
  <circle cx="1245" cy="132" r="44" fill="#fff6dc" opacity=".9"/>

  <g fill="#ffffff" opacity=".5">
    <ellipse cx="300" cy="86" rx="130" ry="24"/>
    <ellipse cx="395" cy="68" rx="78" ry="18"/>
    <ellipse cx="880" cy="58" rx="150" ry="22"/>
    <ellipse cx="1000" cy="74" rx="90" ry="18"/>
  </g>

  <path d="M0 252 L150 176 L290 224 L430 150 L580 216 L720 158 L880 232 L1010 178 L1170 238 L1320 172 L1470 226 L1600 186 L1600 400 L0 400 Z" fill="url(#far)"/>
  <path d="M0 300 L150 248 L300 292 L470 240 L640 294 L810 244 L980 296 L1150 248 L1330 298 L1480 254 L1600 296 L1600 400 L0 400 Z" fill="url(#mid)"/>

  <path d="M0 340 Q200 300 400 330 Q600 358 800 330 Q1000 302 1200 332 Q1400 360 1600 328 L1600 400 L0 400 Z" fill="url(#hill)"/>
  <rect x="0" y="228" width="1600" height="172" fill="url(#pines)"/>
  <rect x="0" y="356" width="1600" height="44" fill="url(#ground)"/>
</svg>
